<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Agendamentos — And'Ǝ</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Inter:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/paginas.css">
</head>
<body>

  <header class="topo">
    <a href="dashboard.html" class="topo-logo" aria-label="Voltar ao dashboard">
      <img src="img/logo.png" alt="Logo And'Ǝ">
      <span>And'Ǝ</span>
    </a>

    <nav class="topo-links">
      <a href="clientes.html">Clientes</a>
      <a href="tatuadores.html">Tatuadores</a>
      <a href="agendamentos.html" class="ativo">Agendamentos</a>
      <a href="senioridade.html">Senioridade</a>
      <a href="estilos.html">Estilos</a>
    </nav>

    <button onclick="sair()" class="topo-sair">
      <i class="bi bi-box-arrow-right"></i> Sair
    </button>
  </header>

  <main class="conteudo">

    <h1 class="titulo-pagina">Agendamentos</h1>

    <!-- Formulário para cadastrar novo agendamento -->
    <form id="form-agendamento" class="form-cadastro">
      <select id="idcliente" class="campo" required>
        <option value="">Cliente...</option>
      </select>
      <select id="idtatuador" class="campo" required>
        <option value="">Tatuador...</option>
      </select>
      <input type="date" id="dataagendamento" class="campo" required>
      <input type="time" id="horaagendamento" class="campo" required>
      <input type="number" id="valortatuagem" class="campo" placeholder="Valor (R$)" step="0.01" min="0">

      <div class="campo-grupo">
        <textarea id="descricaotatuagem" class="campo campo-texto" placeholder="Descrição da tatuagem"></textarea>
      </div>

      <div class="campo-grupo">
        <label class="campo-label" for="desenho">Desenho aprovado (imagem)</label>
        <input type="file" id="desenho" class="campo campo-arquivo" accept="image/*">
      </div>

      <!-- Esse bloco começa escondido — só aparece quando estamos editando um agendamento existente -->
      <div id="bloco-status" style="display: none;">
        <select id="status" class="campo">
          <option value="pendente">Pendente</option>
          <option value="confirmado">Confirmado</option>
          <option value="concluido">Concluído</option>
          <option value="cancelado">Cancelado</option>
        </select>
      </div>

      <button id="btn-submit-agendamento" type="submit" class="btn-cadastrar">Cadastrar</button>
    </form>

    <!-- Tabela onde os agendamentos vão aparecer -->
    <div class="tabela-wrapper">
      <table class="tabela">
        <thead>
          <tr>
            <th>ID</th>
            <th>Cliente</th>
            <th>Tatuador</th>
            <th>Data</th>
            <th>Hora</th>
            <th>Valor</th>
            <th>Status</th>
            <th>Desenho</th>
            <th>Ações</th>
          </tr>
        </thead>
        <tbody id="corpo-tabela">
          <!-- os agendamentos vão aparecer aqui -->
        </tbody>
      </table>
    </div>

  </main>

  <script src="js/auth.js"></script>
  <script src="js/agendamentos.js"></script>

</body>
</html>
