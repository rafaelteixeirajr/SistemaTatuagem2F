<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tatuadores — And'Ǝ</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Inter:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/paginas.css">
</head>
<body>

  <header class="topo">
    <a href="dashboard.html" class="topo-logo" aria-label="Voltar ao dashboard">
      <img src="img/logo.png" alt="Logo And'Ǝ">
      <span>And'Ǝ</span>
    </a>

    <nav class="topo-links">
      <a href="clientes.html">Clientes</a>
      <a href="tatuadores.html" class="ativo">Tatuadores</a>
      <a href="agendamentos.html">Agendamentos</a>
      <a href="senioridade.html">Senioridade</a>
      <a href="estilos.html">Estilos</a>
    </nav>

    <button onclick="sair()" class="topo-sair">
      <i class="bi bi-box-arrow-right"></i> Sair
    </button>
  </header>

  <main class="conteudo">

    <h1 class="titulo-pagina">Tatuadores</h1>

    <!-- Formulário para cadastrar novo tatuador -->
    <form id="form-tatuador" class="form-cadastro">
      <input type="text" id="nometatuador" class="campo" placeholder="Nome" required>
      <input type="text" id="cpf" class="campo" placeholder="CPF (só números)" required>
      <input type="email" id="email" class="campo" placeholder="E-mail">
      <input type="text" id="telefone" class="campo" placeholder="Telefone">
      <select id="idsenioridade" class="campo" required>
        <option value="">Senioridade...</option>
        <!-- as opções são preenchidas pelo JavaScript -->
      </select>

      <div class="campo-grupo">
        <label class="campo-label">Estilos que domina</label>
        <div id="lista-estilos" class="lista-estilos">
          <!-- os checkboxes são preenchidos pelo JavaScript -->
        </div>
      </div>

      <button id="btn-submit-tatuador" type="submit" class="btn-cadastrar">Cadastrar</button>
    </form>

    <!-- Tabela onde os tatuadores vão aparecer -->
    <div class="tabela-wrapper">
      <table class="tabela">
        <thead>
          <tr>
            <th>ID</th>
            <th>Nome</th>
            <th>CPF</th>
            <th>E-mail</th>
            <th>Telefone</th>
            <th>Senioridade</th>
            <th>Estilos</th>
            <th>Ações</th>
          </tr>
        </thead>
        <tbody id="corpo-tabela">
          <!-- os tatuadores vão aparecer aqui -->
        </tbody>
      </table>
    </div>

  </main>

  <script src="js/auth.js"></script>
  <script src="js/tatuadores.js"></script>

</body>
</html>
