<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Login — And'Ǝ</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Inter:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/login.css">
</head>
<body>

  <main class="login-wrapper">
    <div class="login-card">
      <img src="img/logo.png" alt="Logo And'Ǝ" class="logo-destaque">
      <p class="subtitulo text-center">Entrar</p>

      <form id="form-login">
        <div class="mb-3">
          <input type="email" id="email" class="form-control form-control-lg" placeholder="E-mail" required>
        </div>
        <div class="mb-3">
          <input type="password" id="senha" class="form-control form-control-lg" placeholder="Senha" required>
        </div>
        <button type="submit" class="btn-entrar w-100">Entrar</button>
      </form>

      <p class="mt-4 text-center mb-0 rodape">
        Não tem conta? <a href="cadastro.html">Cadastre-se</a>
      </p>
    </div>
  </main>

  <script src="js/login.js"></script>

</body>
</html>
