<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Senioridade — And'Ǝ</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Inter:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/paginas.css">
</head>
<body>

  <header class="topo">
    <a href="dashboard.html" class="topo-logo" aria-label="Voltar ao dashboard">
      <img src="img/logo.png" alt="Logo And'Ǝ">
      <span>And'Ǝ</span>
    </a>

    <nav class="topo-links">
      <a href="clientes.html">Clientes</a>
      <a href="tatuadores.html">Tatuadores</a>
      <a href="agendamentos.html">Agendamentos</a>
      <a href="senioridade.html" class="ativo">Senioridade</a>
      <a href="estilos.html">Estilos</a>
    </nav>

    <button onclick="sair()" class="topo-sair">
      <i class="bi bi-box-arrow-right"></i> Sair
    </button>
  </header>

  <main class="conteudo">

    <h1 class="titulo-pagina">Senioridade</h1>

    <!-- Formulário para cadastrar nova senioridade -->
    <form id="form-senioridade" class="form-cadastro form-simples">
      <input type="text" id="nome" class="campo" placeholder="Nome (ex: Júnior)" required>
      <button id="btn-submit-senioridade" type="submit" class="btn-cadastrar">Cadastrar</button>
    </form>

    <!-- Tabela onde as senioridades vão aparecer -->
    <div class="tabela-wrapper">
      <table class="tabela">
        <thead>
          <tr>
            <th>ID</th>
            <th>Nome</th>
            <th>Ações</th>
          </tr>
        </thead>
        <tbody id="corpo-tabela">
          <!-- as senioridades vão aparecer aqui -->
        </tbody>
      </table>
    </div>

  </main>

  <script src="js/auth.js"></script>
  <script src="js/senioridade.js"></script>

</body>
</html>
